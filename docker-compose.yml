services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_RPW}
      - MYSQL_DATABASE=${DB_DB}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PW}
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 1s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8085:8080"

  # production: source baked into image, no hot reload
  app:
    profiles: ["prod"]
    build: .
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./journal:/journal
    environment:
      - PORT=${PORT}
      - MYSQL_HOST=db
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PW}
      - MYSQL_DATABASE=${DB_DB}
    depends_on:
      db:
        condition: service_healthy

  # development: live source mount, node --watch + tailwind --watch
  app-dev:
    profiles: ["dev"]
    build: .
    restart: unless-stopped
    command: sh -c "npx tailwindcss -i ./public/input.css -o ./public/output.css --watch & node --watch index.js"
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules   # seeded from image; keeps deps when host dir is empty
      - ./journal:/journal
    environment:
      - PORT=${PORT}
      - MYSQL_HOST=db
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PW}
      - MYSQL_DATABASE=${DB_DB}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  node_modules:
